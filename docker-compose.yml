version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object store (simulates AWS S3 for the data lake)
  # Access the UI at http://localhost:9001  (user: minioadmin / minioadmin)
  # ─────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hma_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # MinIO bucket setup (runs once then exits)
  # Creates the "datalake" bucket automatically
  # ─────────────────────────────────────────────────────────────────────────────
  minio_setup:
    image: minio/mc:latest
    container_name: hma_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/datalake &&
      echo '✅ Bucket datalake created'
      "

volumes:
  minio_data:
